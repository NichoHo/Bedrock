name: Weekly Corpus Test

# No `schedule` trigger yet: the corpus itself (BEDROCK_SPEC.md Phase 6) isn't
# implemented, and a job that's guaranteed to fail on a schedule is noise, not
# signal. Re-add `schedule: - cron: '0 0 * * 0'` once `Run Corpus` below does
# something real.
on:
  workflow_dispatch:

jobs:
  test-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Bedrock
        run: cargo build --release

      - name: Run Corpus
        run: |
          echo "Status: Not yet implemented"
          exit 4
