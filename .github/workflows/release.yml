name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Run tests (Self-test)
        run: cross test --release --target ${{ matrix.target }}

      # The three matrix jobs all produce a binary literally named `bedrock`;
      # uploading that name from every job would have each release asset
      # overwrite the last. Renaming to include the target triple, and
      # publishing a checksum alongside it, so `cosign`/`sha256sum -c`
      # verification (SECURITY.md) has something real to check once signing
      # exists.
      - name: Package
        run: |
          asset="bedrock-${{ matrix.target }}"
          cp target/${{ matrix.target }}/release/bedrock "$asset"
          sha256sum "$asset" > "$asset.sha256"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bedrock-${{ matrix.target }}
            bedrock-${{ matrix.target }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snap:
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - uses: actions/checkout@v4
      - name: Build Snap
        id: build
        uses: snapcore/action-build@v1
      - name: Publish Snap
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
