name: Release

# A `v*` tag publishes a GitHub release, a signed container image and a signed
# SBOM. Running the workflow by hand (workflow_dispatch) does a dry run: it
# builds, tests, slims and checks everything, and publishes and signs nothing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # BEDROCK_SPEC.md 9.6 / 11.2: slim Bedrock's own release image before any
  # binary is published. A failure here stops the release.
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/bedrock-cli/Cargo.toml | head -1)"
          if [ "v$crate" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match crate version $crate" >&2
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked
      - name: Slim Bedrock with Bedrock
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" ./scripts/self-test.sh

  # BEDROCK_SPEC.md 13: a second build from the same source must be
  # byte-identical. Checked on the static musl binary, which the snap uses.
  reproducible:
    needs: self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross
      - name: Build twice and compare
        run: |
          for n in 1 2; do
            cargo clean
            cross build --release --locked --target x86_64-unknown-linux-musl
            sha256sum target/x86_64-unknown-linux-musl/release/bedrock | tee "build-$n.sha256"
          done
          [ "$(cut -d' ' -f1 build-1.sha256)" = "$(cut -d' ' -f1 build-2.sha256)" ] || {
            echo "two builds of the same source differ" >&2
            exit 1
          }

  build:
    needs: self-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Run tests
        run: cross test --release --locked --target ${{ matrix.target }}

      # The three matrix jobs all produce a binary literally named `bedrock`,
      # so each asset carries its target triple and a checksum.
      - name: Package
        run: |
          mkdir dist
          asset="dist/bedrock-${{ matrix.target }}"
          cp target/${{ matrix.target }}/release/bedrock "$asset"
          (cd dist && sha256sum "$(basename "$asset")" > "$(basename "$asset").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: bedrock-${{ matrix.target }}
          path: dist/

  # The release image, pruned by Bedrock itself (BEDROCK_SPEC.md 11.3), plus
  # its SBOM. Pushing and signing happen only for a tag.
  image:
    needs: self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Bedrock
        run: cargo build --release --locked
      - name: Slim the release image
        run: |
          docker build -t bedrock-release .
          docker save bedrock-release -o image.tar
          sudo -E env "PATH=$PATH" "HOME=$HOME" target/release/bedrock slim image.tar \
            --workload-duration 20s -o slim --report slim-report.json -- --version
      - name: SBOM of the pruned image
        run: target/release/bedrock sbom slim > bedrock.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: bedrock-sbom
          path: |
            bedrock.spdx.json
            slim-report.json

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v3
      - name: Push, sign and attest the image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy "oci:slim" "docker://$image:$GITHUB_REF_NAME"
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://$image:$GITHUB_REF_NAME")"
          cosign sign --yes "$image@$digest"
          cosign attest --yes --type spdxjson --predicate bedrock.spdx.json "$image@$digest"

  # Needs the three binaries and the SBOM, so it runs last. Skipped on a dry run.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [reproducible, build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      # Keyless: the signing identity is this workflow on this tag, recorded in
      # the Sigstore transparency log. SECURITY.md says how to verify it.
      - name: Sign every asset
        run: |
          cd dist
          for f in bedrock-* bedrock.spdx.json; do
            case "$f" in *.sha256) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Release notes
        run: |
          cat > notes.md <<EOF
          ## Verify a download

          \`\`\`
          cosign verify-blob \\
            --bundle bedrock-x86_64-unknown-linux-musl.sigstore.json \\
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            bedrock-x86_64-unknown-linux-musl
          \`\`\`

          The container image is \`ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}\`, signed the
          same way. \`bedrock.spdx.json\` is the SBOM of that image.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true

  snap:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      # Build only. Publishing needs a store account and a login token that
      # this repository does not have yet (see CONTRIBUTING.md).
      - name: Build Snap
        uses: snapcore/action-build@v1
