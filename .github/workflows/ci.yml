name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Check formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    - name: Run tests
      run: cargo test --workspace --all-targets --all-features

  # BEDROCK_SPEC.md Phase 1 exit criterion: SBOMs validate against the
  # official SPDX and CycloneDX validators. One image per package database
  # format and ecosystem parser: apk, dpkg, distroless status.d, rpm in all
  # three database formats (SQLite, Berkeley DB, NDB), npm, and Python.
  sbom-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build
      run: cargo build --release
    - name: Generate SBOMs
      run: |
        mkdir -p sboms
        for image in alpine:3.20 ubuntu:24.04 gcr.io/distroless/base-debian12 \
                     fedora:40 rockylinux:8 opensuse/leap:15.6 \
                     node:22-alpine python:3.12-slim; do
          name=$(echo "$image" | tr '/:.' '___')
          ./target/release/bedrock sbom "$image" --format spdx > "sboms/$name.spdx.json"
          ./target/release/bedrock sbom "$image" --format cyclonedx > "sboms/$name.cdx.json"
        done
    - name: Validate
      run: scripts/validate-sbom.sh sboms/*.json
