name: Feature request
description: A change to what Bedrock does.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and cannot.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would change
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
    validations:
      required: false
