name: 'Bedrock Scan'
description: 'Scan a container image for vulnerabilities using Bedrock'
inputs:
  image:
    description: 'The image reference or path to scan'
    required: true
  fail-on:
    description: 'Fail on severity (low, medium, high, critical)'
    required: false
    default: 'high'
  format:
    description: 'Output format (terminal, sarif)'
    required: false
    default: 'terminal'
runs:
  using: "composite"
  steps:
    - name: Download Bedrock
      shell: bash
      run: |
        # Stub for action: In reality this would download the built bedrock binary
        echo "Bedrock action stub. Assuming bedrock is in PATH."
    - name: Run Bedrock DB Update
      shell: bash
      run: bedrock db update
    - name: Run Bedrock Scan
      shell: bash
      run: |
        bedrock scan "${{ inputs.image }}" --fail-on "${{ inputs.fail-on }}" --format "${{ inputs.format }}"
