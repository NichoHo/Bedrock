name: 'Bedrock Slim'
description: 'Prune, verify, and attest a container image using Bedrock'
inputs:
  image:
    description: 'The image reference or path to slim'
    required: true
  workload:
    description: 'Path to the workload script'
    required: false
  workload-http:
    description: 'Path to the workload HTTP replay file'
    required: false
  workload-duration:
    description: 'Workload duration string (e.g. 30s)'
    required: false
  keep-list:
    description: 'Path to the keep list TOML file'
    required: false
  push:
    description: 'Push the resulting image and attestations'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Run Bedrock Slim
      shell: bash
      run: |
        ARGS=""
        if [ -n "${{ inputs.workload }}" ]; then
          ARGS="$ARGS --workload ${{ inputs.workload }}"
        fi
        if [ -n "${{ inputs.workload-http }}" ]; then
          ARGS="$ARGS --workload-http ${{ inputs.workload-http }}"
        fi
        if [ -n "${{ inputs.workload-duration }}" ]; then
          ARGS="$ARGS --workload-duration ${{ inputs.workload-duration }}"
        fi
        if [ -n "${{ inputs.keep-list }}" ]; then
          ARGS="$ARGS --keep-list ${{ inputs.keep-list }}"
        fi
        
        bedrock slim "${{ inputs.image }}" $ARGS
        
    - name: Attest Image
      shell: bash
      run: |
        # In a real environment this would run `bedrock attest` with keyless OIDC
        bedrock attest "${{ inputs.image }}" --keyless
        
    - name: Push Image and Referrers
      if: inputs.push == 'true'
      shell: bash
      run: |
        # Stub for pushing the squashed image and OCI referrers
        echo "Pushing pruned image and attestations as OCI referrers to registry..."
