name: bedrock
base: core22
version: '0.1.0'
summary: A container image reduction tool
description: |
  Bedrock traces container workloads and removes unused files to create a distroless
  equivalent. It generates SBOMs, matches vulnerabilities, prunes, and signs the output.

  Commands: inspect, sbom, db, scan, trace, slim, attest, report. Tracing and
  slimming need Linux (ptrace and a chroot), which is why this snap is
  classic-confined.

# Not "stable" until the corpus passes in CI on a release tag.
grade: devel
# Classic: trace and slim run an image's entrypoint under ptrace in a chroot
# and mount namespace, which strict confinement blocks. The store reviews
# classic requests manually.
confinement: classic

parts:
  bedrock:
    plugin: rust
    # The crate to build, not the workspace root (which has no [package] of
    # its own to install).
    source: crates/bedrock-cli
    # No build-packages: reqwest is built with rustls (not native-tls), so
    # there's no OpenSSL to link against and nothing here needs pkg-config.

apps:
  bedrock:
    command: bin/bedrock
