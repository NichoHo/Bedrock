[workspace]
members = [
    "crates/bedrock-cli",
    "crates/bedrock-oci",
    "crates/bedrock-fs",
    "crates/bedrock-sbom",
    "crates/bedrock-vuln",
    "crates/bedrock-trace",
    "crates/bedrock-prune",
    "crates/bedrock-verify",
    "crates/bedrock-attest",
    "crates/bedrock-report",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
