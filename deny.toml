# cargo-deny policy (BEDROCK_SPEC.md 11.2): block known-vulnerable and
# unlicensed dependencies. Run locally with `cargo deny check`.

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",             # option-ext, via dirs
    "CDLA-Permissive-2.0", # webpki-roots (CA list data)
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
