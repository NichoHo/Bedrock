[package]
name = "bedrock"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# rustls instead of the default native-tls: avoids linking OpenSSL, which is
# what makes musl cross-builds (the release target the snap package uses)
# fragile without a vendored OpenSSL build.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
# SPDX 2.3 requires a SHA-1 checksum on every file element. 0.10 to share
# the `digest` crate version with sha2.
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
# Scratch space for layers pulled out of a `docker save` archive.
tempfile = "3"
dirs = "5.0"
chrono = "0.4"
# Fedora, RHEL 9 and Amazon Linux 2023 store the rpm database as SQLite.
# `bundled` compiles SQLite in, so the binary stays static (musl) with no
# system libsqlite3.
rusqlite = { version = "0.40", features = ["bundled"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
goblin = { version = "0.10.7", default-features = false, features = ["elf64", "elf32", "endian_fd"] }
libc = "0.2.190"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1"
