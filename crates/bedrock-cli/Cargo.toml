[package]
name = "bedrock"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# rustls instead of the default native-tls: avoids linking OpenSSL, which is
# what makes musl cross-builds (the release target the snap package uses)
# fragile without a vendored OpenSSL build.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
chrono = "0.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3"
